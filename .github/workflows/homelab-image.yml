# Builds the fork's container image (flac_level patch + Debian trixie Dockerfile).
# Pull requests: build, smoke-test and run the flac_level unit tests only. Pushes to develop: also publish to
# ghcr.io/yannb2/whipper with the tags latest and sha-<short sha>.
name: Homelab image

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/whipper

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from git tags

      # The fork has no tags of its own; without upstream's, setuptools-scm
      # versions the build 0.1.devN instead of the next whipper release.
      - name: Fetch upstream tags
        run: git fetch --tags https://github.com/whipper-team/whipper.git

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: whipper:test

      - name: Smoke test
        run: |
          docker run --rm whipper:test -v
          docker run --rm --entrypoint flac whipper:test --version
          # `whipper cd rip --help` needs a CD drive, so test the patch with its
          # unit tests instead (they ship inside the installed package).
          # The test helpers need Twisted, which the image doesn't ship.
          docker run --rm --user root --entrypoint sh whipper:test -c '
            pip3 install --quiet --break-system-packages twisted &&
            python3 -m unittest -v \
              whipper.test.test_program_flac whipper.test.test_result_logger'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=whipper with a flac_level option (Yann's homelab fork)
